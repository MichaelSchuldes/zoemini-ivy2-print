plugins {
    id 'com.android.application'
}

android {
    namespace 'com.michaelschuldes.zoemini_ivy2_print'
    compileSdk 34

    defaultConfig {
        applicationId "com.michaelschuldes.zoemini_ivy2_print"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        setProperty("archivesBaseName", "com.michaelschuldes.zoemini-ivy2-print")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "com.michaelschuldes.zoemini-ivy2-print-${variant.buildType.name}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
