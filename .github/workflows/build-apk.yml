name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json sw.js css js icons android/app/src/main/assets/

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APKs (Release & Debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            export KEYSTORE_FILE="release.jks"
          else
            echo "KEYSTORE_BASE64 not set; building release APK with debug signature fallback."
          fi
          ./gradlew assembleDebug assembleRelease --stacktrace
          rm -f app/release.jks
          cp app/build/outputs/apk/release/com.michaelschuldes.zoemini-ivy2-print-release.apk app/build/outputs/apk/release/com.michaelschuldes.zoemini-ivy2-print.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: com.michaelschuldes.zoemini-ivy2-print-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: com.michaelschuldes.zoemini-ivy2-print-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload APKs to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/release/com.michaelschuldes.zoemini-ivy2-print.apk
            android/app/build/outputs/apk/release/com.michaelschuldes.zoemini-ivy2-print-release.apk
            android/app/build/outputs/apk/debug/com.michaelschuldes.zoemini-ivy2-print-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
