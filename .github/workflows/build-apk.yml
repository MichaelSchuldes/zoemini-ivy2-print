name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html manifest.json sw.js css js icons android/app/src/main/assets/

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/com.michaelschuldes.zoemini-ivy2-print-debug.apk app/build/outputs/apk/debug/com.michaelschuldes.zoemini-ivy2-print.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.michaelschuldes.zoemini-ivy2-print-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/com.michaelschuldes.zoemini-ivy2-print.apk
            android/app/build/outputs/apk/debug/com.michaelschuldes.zoemini-ivy2-print-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
